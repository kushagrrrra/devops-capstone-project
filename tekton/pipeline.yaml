apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  description: >-
    Continuous delivery for the accounts service:
    clone -> (lint, test) -> build -> deploy -> smoke test.
  params:
    - name: repo-url
      type: string
      default: https://github.com/kushagrrrra/devops-capstone-project.git
    - name: revision
      type: string
      default: main
    - name: image
      type: string
      default: accounts
  workspaces:
    - name: pipeline-workspace
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: lint
      runAfter: [clone]
      taskRef:
        name: flake8-lint
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: tests
      runAfter: [clone]
      taskRef:
        name: pytest-test
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: build
      runAfter: [lint, tests]
      taskRef:
        name: docker-build
      params:
        - name: image
          value: $(params.image)
        - name: tag
          value: $(tasks.clone.results.commit)
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: deploy
      runAfter: [build]
      taskRef:
        name: deploy-image
      params:
        - name: deployment
          value: accounts
        - name: container
          value: accounts
        - name: image
          value: $(params.image):$(tasks.clone.results.commit)

    - name: smoke-test
      runAfter: [deploy]
      taskRef:
        name: smoke-test
      params:
        - name: url
          value: http://accounts.default.svc.cluster.local:8080
      workspaces:
        - name: source
          workspace: pipeline-workspace
