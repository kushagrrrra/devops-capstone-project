[tool:pytest]
testpaths = tests
addopts = -v --cov=service --cov-report=term-missing --cov-fail-under=95

[coverage:run]
source = service
omit = service/wsgi.py

[flake8]
max-line-length = 127
max-complexity = 10
exclude = .git,__pycache__,.venv,venv,build,dist
per-file-ignores =
    service/__init__.py:E402,F401

[pylint.'MESSAGES CONTROL']
disable = E1101
