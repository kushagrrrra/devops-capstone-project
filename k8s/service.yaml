# Exposes the accounts service. On Docker Desktop a LoadBalancer
# service is published on localhost, so the API is at http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: accounts
  labels:
    app: accounts
spec:
  type: LoadBalancer
  selector:
    app: accounts
  ports:
    - name: http
      port: 8080
      targetPort: 8080
